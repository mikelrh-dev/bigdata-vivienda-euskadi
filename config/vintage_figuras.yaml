# Vintage (año) declarado para cada figura del proyecto.
#
# Autoridad única del sello de año que llevan los PNG: el generador lo pinta
# en la esquina inferior derecha y lo escribe como metadato PNG, así que
# `scripts/verificar_vintage_figuras.py` puede comprobarlo sin OCR.
#
# Lo leen:
#   analysis/run_analisis_mongo.py    (_save de las 33 figuras Mongo)
#   transform/generar_figuras_N.py    (N1/N2/N3/N7 + H2/F/H8/J/P offline)
#   visuals/*.py                      (_guardar y savefig de la capa 2026)
#   scripts/sincronizar_figuras.py    (copias gold -> deck y gold -> memoria)
#   scripts/verificar_vintage_figuras.py
#
# Regla del proyecto (config/comparabilidad.yaml, regla 4): no se publica una
# cifra sin declarar su vintage. Un `mixto` obliga a decir que no es comparable.
#
# Códigos: 2024 | 2026 | mixto | flujo | acumulado | sin-fecha

codigos:
  "2024": "Datos: 2024"
  "2026": "Datos: 2026"
  mixto: "Datos: 2024 + 2026 (no comparable)"
  flujo: "Datos: flujo 2020-2024"
  acumulado: "Datos: registro Etxebide (sin año único)"
  sin-fecha: "Datos: sin año único"

# Etiqueta larga solo donde el código se queda corto.
etiquetas:
  B_paro_vs_precio.png: "Datos: paro 2024 + precio 2026 (no comparable)"
  D_distancia_vs_precio.png: "Datos: precio 2026 + distancia sin año"
  H2_tier_confianza_ABCD.png: "Datos: muestra de anuncios 2026"
  H7_accesibilidad_tiempo_capital.png: "Datos: esfuerzo 2024 + distancia sin año"
  O_ranking_bloqueado_n30.png: "Datos: esfuerzo 2024 (muestra 2026)"
  P_oficial_vs_anuncios_por_TH.png: "Datos: oficial 2024 + anuncios 2026 (no comparable)"
  g5_esfuerzo_robustos.png: "Datos: esfuerzo 2024 (muestra 2026)"
  K_vpo_terminadas_vs_esfuerzo.png: "Datos: VPO 2020-2024 + esfuerzo 2024"
  transporte_oferta_vs_esfuerzo.png: "Datos: esfuerzo 2024 + GTFS 2026"
  M26_brecha_2024_2026.png: "Datos: 2024 -> 2026 (diferencia de nivel)"
  M26_brecha_n5.png: "Datos: 2024 -> 2026 (diferencia de nivel)"
  fig-brecha-2026-opaca.png: "Datos: 2024 -> 2026 (diferencia de nivel)"
  fig-ranking-2026-opaca.png: "Datos: anuncios 2026 + salario 2026 (Tier 2026)"
  fig-cobertura-2026-opaca.png: "Datos: 2026"
  M26_ranking_esfuerzo_muestra_2026.png: "Datos: anuncios 2026 + salario 2026 (Tier 2026)"
  G_gaps_limitaciones.png: "Datos: conteos del pipeline (sin año)"
  H5_vpo_terminadas_por_mil.png: "Datos: tasa VPO 2020-2024, por 1.000 hab."
  S_serie_vpo_2004_2024.png: "Datos: tasa VPO 2004-2024, ventana de 5 años"
  # {rango} lo resuelve analysis/vintage_figuras.py desde `Sorteo` en Mongo:
  # el registro no tiene un año único, pero sí un rango de fechas real.
  C_vpo_por_estado.png: "Datos: registro Etxebide (sorteo {rango})"
